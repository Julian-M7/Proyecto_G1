<rect width="1900" height="920" fill="white"/>
<text x="950.0" y="48" text-anchor="middle" font-size="30" font-weight="bold" fill="#1A1A1A">Diagrama de contexto · SGMP v1.0 (Martin Pescador)</text>
<text x="950.0" y="84" text-anchor="middle" font-size="20" fill="#6B6B6B">Usuarios a la izquierda · sistemas, dispositivos y registros vecinos a la derecha</text>
