<text x="950.0" y="268" text-anchor="middle" font-size="52" font-weight="bold" fill="#1A1A1A">SGMP</text>
<text x="950.0" y="326" text-anchor="middle" font-size="24" fill="#1A1A1A">Sistema de gestión de ventas,</text>
<text x="950.0" y="360" text-anchor="middle" font-size="24" fill="#1A1A1A">inventario y finanzas</text>
<text x="950.0" y="436" text-anchor="middle" font-size="21" fill="#6B6B6B">registrar y anular ventas</text>
<text x="950.0" y="474" text-anchor="middle" font-size="21" fill="#6B6B6B">controlar inventario y alertas</text>
<text x="950.0" y="512" text-anchor="middle" font-size="21" fill="#6B6B6B">registrar egresos</text>
<text x="950.0" y="550" text-anchor="middle" font-size="21" fill="#6B6B6B">cerrar caja y reportar</text>
<text x="950.0" y="588" text-anchor="middle" font-size="21" fill="#6B6B6B">perfiles y auditoría</text>
<text x="950.0" y="756" text-anchor="middle" font-size="19" fill="#A87B00">límite del sistema a especificar</text>
