<text x="1380.0" y="556.0" text-anchor="middle" font-size="17" fill="#1A1A1A">datos históricos (TBD)</text>
<text x="950.0" y="886" text-anchor="middle" font-size="19" fill="#6B6B6B">Cada flecha que cruza el límite se especifica como interfaz en 3.1. Los clientes del local no usan el sistema (usuarios indirectos).</text>
